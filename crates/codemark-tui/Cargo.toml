[package]
name = "codemark-tui"
version = "0.7.14"
edition = "2024"
description = "Terminal UI for Codemark using ratatui"
license = "MIT"
repository = "https://github.com/DanielCardonaRojas/codemark"
homepage = "https://github.com/DanielCardonaRojas/codemark"

[lib]
name = "codemark_tui"
path = "src/lib.rs"

# The TUI is a companion binary that `codemark tui` shells out to. dist builds
# and uploads its precompiled archives (codemark-tui-<target>.tar.xz) so the
# hand-maintained `codemark` Homebrew formula can bundle this binary alongside
# the CLI from prebuilt artifacts. It still has no Homebrew formula of its own:
# `installers` excludes homebrew workspace-wide (see the root Cargo.toml).
[package.metadata.dist]
dist = true

[[bin]]
name = "codemark-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
syntect = "5.2"
syntect-assets = "0.23"
pulldown-cmark = { version = "0.13", default-features = false }
serde_yaml = "0.9"
tokio = { workspace = true }
codemark-core = { path = "../codemark-core" }
rusqlite = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
unicode-segmentation = "1"
unicode-width = "0.2"
futures = "0.3"
copypasta = "0.10"
open = "5.3.5"
reqwest = { workspace = true, features = ["stream"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
insta = "1"
