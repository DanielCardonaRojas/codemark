[package]
name = "codemark-tui"
version = "0.7.12"
edition = "2024"
description = "Terminal UI for Codemark using ratatui"
license = "MIT"
repository = "https://github.com/DanielCardonaRojas/codemark"
homepage = "https://github.com/DanielCardonaRojas/codemark"

[lib]
name = "codemark_tui"
path = "src/lib.rs"

# The TUI is an optional companion binary that `codemark tui` shells out to;
# it ships via `cargo install codemark-tui`, not the prebuilt dist installers,
# so it doesn't generate its own second installer/Homebrew formula.
[package.metadata.dist]
dist = false

[[bin]]
name = "codemark-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
syntect = "5.2"
syntect-assets = "0.23"
serde_yaml = "0.9"
tokio = { workspace = true }
codemark-core = { path = "../codemark-core" }
rusqlite = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
unicode-segmentation = "1"
unicode-width = "0.2"
futures = "0.3"
copypasta = "0.10"
reqwest = { workspace = true, features = ["stream"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
insta = "1"
