[package]
name = "codemark-tui"
version = "0.7.7"
edition = "2024"
description = "Terminal UI for Codemark using ratatui"
license = "MIT"

[lib]
name = "codemark_tui"
path = "src/lib.rs"

[[bin]]
name = "codemark-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
syntect = "5.2"
syntect-assets = "0.23"
serde_yaml = "0.9"
tokio = { workspace = true }
codemark-core = { path = "../codemark-core" }
rusqlite = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
unicode-segmentation = "1"
unicode-width = "0.2"
futures = "0.3"
copypasta = "0.10"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
