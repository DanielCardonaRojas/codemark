{% import "partials/icon.html" as icons %}
<form hx-get="/tours"
      hx-target="#tour-list"
      hx-swap="outerHTML"
      hx-trigger="change from:select, keyup changed delay:300ms from:input[name=q]"
      hx-push-url="true"
      id="tours-filter-form"
      class="flex flex-wrap items-center gap-4 mb-8">

    <div class="relative flex-1 min-w-[200px]">
        <div class="absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary">
            {% call icons::icon("search", 16) %}
        </div>
        <input type="text"
               name="q"
               placeholder="Search tours..."
               class="w-full bg-bg-secondary border border-border rounded-md pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-accent transition-colors"
               value="{{ params.q.as_deref().unwrap_or("") }}">
    </div>

    <select name="repo_url" class="bg-bg-secondary border border-border rounded-md pl-3 pr-8 py-2 text-sm focus:outline-none focus:border-accent cursor-pointer transition-colors appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238b949e%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E')] bg-[length:0.65em] bg-[right_0.7rem_center] bg-no-repeat">
        <option value="">All Repositories</option>
        {% for repo in repos %}
        <option value="{{ repo }}" {% if params.repo_url.as_ref() == Some(repo) %}selected{% endif %}>{{ repo }}</option>
        {% endfor %}
    </select>

    <select name="branch" class="bg-bg-secondary border border-border rounded-md pl-3 pr-8 py-2 text-sm focus:outline-none focus:border-accent cursor-pointer transition-colors appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238b949e%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E')] bg-[length:0.65em] bg-[right_0.7rem_center] bg-no-repeat">
        <option value="">All Branches</option>
        {% for branch in branches %}
        <option value="{{ branch }}" {% if params.branch.as_ref() == Some(branch) %}selected{% endif %}>{{ branch }}</option>
        {% endfor %}
    </select>

    <select name="tag" class="bg-bg-secondary border border-border rounded-md pl-3 pr-8 py-2 text-sm focus:outline-none focus:border-accent cursor-pointer transition-colors appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238b949e%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E')] bg-[length:0.65em] bg-[right_0.7rem_center] bg-no-repeat">
        <option value="">All Tags</option>
        {% for tag in tags %}
        <option value="{{ tag }}" {% if params.tag.as_ref() == Some(tag) %}selected{% endif %}>{{ tag }}</option>
        {% endfor %}
    </select>

    <select name="sort" class="bg-bg-secondary border border-border rounded-md pl-3 pr-8 py-2 text-sm focus:outline-none focus:border-accent cursor-pointer transition-colors appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238b949e%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E')] bg-[length:0.65em] bg-[right_0.7rem_center] bg-no-repeat">
        <option value="updated_at_desc" {% if params.sort.as_deref() == Some("updated_at_desc") %}selected{% endif %}>Newest First</option>
        <option value="updated_at_asc" {% if params.sort.as_deref() == Some("updated_at_asc") %}selected{% endif %}>Oldest First</option>
        <option value="title_asc" {% if params.sort.as_deref() == Some("title_asc") %}selected{% endif %}>Title A-Z</option>
    </select>
</form>
