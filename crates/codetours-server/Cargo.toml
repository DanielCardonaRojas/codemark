[package]
name = "codetours-server"
version = "0.7.19"
edition = "2024"
description = "Server for Codetours"
license = "MIT"

[[bin]]
name = "codetours"
path = "src/main.rs"

# The server is deployed via Fly (see fly.toml), not shipped to end users, so
# exclude it from `dist` release artifacts.
[package.metadata.dist]
dist = false

[dependencies]
codemark-core = { path = "../codemark-core" }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
deadpool-sqlite = { workspace = true }
futures-util = "0.3"
zstd = "0.13"
jsonwebtoken = "9"
reqwest = { workspace = true }
urlencoding = "2"
dotenvy = "0.15.7"

[dev-dependencies]
tempfile = { workspace = true }
