[package]
name = "codemark-core"
version = "0.5.4"
edition = "2024"
description = "Core logic for Codemark: AST queries, resolution engine, and storage"
license = "MIT"

[lib]
name = "codemark_core"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
candle-core = "0.8"
candle-transformers = "0.8"
candle-nn = "0.8"
git2 = "0.19"
regex = "1"
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokenizers = "0.21"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
tree-sitter-dart = "0.1"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
uuid = { version = "1", features = ["v4"] }
hf-hub = "0.4"
sqlite-vec = "0.1.9"
zerocopy = "0.8"
directories = "5"
shellexpand = "3"
