[package]
name = "codemark-core"
version = "0.7.26"
edition = "2024"
description = "Core logic for Codemark: AST queries, resolution engine, and storage"
license = "MIT"

[lib]
name = "codemark_core"
path = "src/lib.rs"

[features]
default = ["semantic", "wasm"]
# Semantic search via local embeddings. Pulls in the heavy candle/hf-hub/
# tokenizers stack; disable (`--no-default-features`) to build a lean binary
# without vector search.
semantic = [
  "dep:candle-core",
  "dep:candle-transformers",
  "dep:candle-nn",
  "dep:tokenizers",
  "dep:hf-hub",
]

# Dynamic WASM grammar loading. Enabled by default: enables wasmtime (via
# tree-sitter's wasm feature) so users can load additional language grammars at
# runtime from the platform cache dir (`$CODEMARK_GRAMMARS_DIR` override, else
# `BaseDirs::cache_dir()/codemark/grammars` — ~/.cache on Linux,
# ~/Library/Caches on macOS). Disable with `--no-default-features`.
wasm = ["tree-sitter/wasm"]

[dependencies]
async-trait = "0.1"
chrono = { workspace = true }
tokio = { workspace = true }
git2 = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tree-sitter = { workspace = true }
uuid = { workspace = true }
candle-core = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
sha2 = "0.10"
tokenizers = { version = "0.21", optional = true }
tree-sitter-c-sharp = "0.23"
tree-sitter-dart = "0.1"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-python = "0.23"
tree-sitter-tsquery = "0.7"
tree-sitter-rust = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
# Sync (ureq) API only — see embeddings/local.rs. Drop the default native-tls
# backend (and unused async `tokio` API) for rustls so we stay openssl-free;
# otherwise Cargo feature unification flips reqwest's native-tls back on too.
hf-hub = { version = "0.4", default-features = false, optional = true, features = [
  "ureq",
  "rustls-tls",
] }
zstd = "0.13"
sqlite-vec = "0.1.9"
zerocopy = "0.8"
directories = "5"
shellexpand = "3"
handlebars = "6"
reqwest = { workspace = true, features = ["stream"] }
tracing = { workspace = true }
shlex = "1.3"

# O_NOFOLLOW for the grammar-install symlink defense (unix only; Windows uses
# FILE_FLAG_OPEN_REPARSE_POINT via std, other targets fall back to a pre-check).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
insta = { version = "1.39", features = ["yaml"] }
