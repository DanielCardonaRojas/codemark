[package]
name = "codemark-core"
version = "0.7.25"
edition = "2024"
description = "Core logic for Codemark: AST queries, resolution engine, and storage"
license = "MIT"

[lib]
name = "codemark_core"
path = "src/lib.rs"

[features]
default = ["semantic"]
# Semantic search via local embeddings. Pulls in the heavy candle/hf-hub/
# tokenizers stack; disable (`--no-default-features`) to build a lean binary
# without vector search.
semantic = [
  "dep:candle-core",
  "dep:candle-transformers",
  "dep:candle-nn",
  "dep:tokenizers",
  "dep:hf-hub",
]

[dependencies]
async-trait = "0.1"
chrono = { workspace = true }
tokio = { workspace = true }
git2 = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tree-sitter = { workspace = true }
uuid = { workspace = true }
candle-core = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
sha2 = "0.10"
tokenizers = { version = "0.21", optional = true }
tree-sitter-c-sharp = "0.23"
tree-sitter-dart = "0.1"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-python = "0.23"
tree-sitter-tsquery = "0.7"
tree-sitter-rust = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
# Sync (ureq) API only — see embeddings/local.rs. Drop the default native-tls
# backend (and unused async `tokio` API) for rustls so we stay openssl-free;
# otherwise Cargo feature unification flips reqwest's native-tls back on too.
hf-hub = { version = "0.4", default-features = false, optional = true, features = [
  "ureq",
  "rustls-tls",
] }
zstd = "0.13"
sqlite-vec = "0.1.9"
zerocopy = "0.8"
directories = "5"
shellexpand = "3"
handlebars = "6"
reqwest = { workspace = true, features = ["stream"] }
tracing = { workspace = true }
shlex = "1.3"

[dev-dependencies]
tempfile = { workspace = true }
insta = { version = "1.39", features = ["yaml"] }
