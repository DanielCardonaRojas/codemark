[package]
name = "codemark-cli"
version = "0.7.13"
edition = "2024"
description = "CLI for Codemark"
license = "MIT"
repository = "https://github.com/DanielCardonaRojas/codemark"
homepage = "https://github.com/DanielCardonaRojas/codemark"

# dist release config: ship a single app whose Homebrew formula is `codemark`
# (matching the existing tap), not `codemark-cli`.
[package.metadata.dist]
formula = "codemark"

[[bin]]
name = "codemark"
path = "src/main.rs"

# Maintainer tool, not a shipped binary: an example so it's excluded from
# `dist` release artifacts and `cargo install`. Generate man pages with:
#   cargo run --example gen-man-pages --features man-pages
[[example]]
name = "gen-man-pages"
path = "examples/gen-man-pages.rs"
required-features = ["man-pages"]

[features]
man-pages = ["clap_mangen"]

[dev-dependencies]
tempfile = { workspace = true }
insta = { version = "1.39", features = ["yaml"] }
git2 = { workspace = true }
rusqlite = { workspace = true }
tree-sitter = { workspace = true }
codetours-server = { path = "../codetours-server" }
axum = { workspace = true }

[dependencies]
codemark-core = { path = "../codemark-core" }
clap = { workspace = true }
clap_complete = "4"
clap_mangen = { version = "0.2", optional = true }
comfy-table = "7"
is-terminal = "0.4"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
handlebars = "6"
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
zstd = "0.13"
rusqlite = { workspace = true }
webbrowser = "1"
url = "2"
urlencoding = "2"
axum = { workspace = true }
tokio-util = "0.7"
open = "5.3.5"
copypasta = "0.10.2"
tracing = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
