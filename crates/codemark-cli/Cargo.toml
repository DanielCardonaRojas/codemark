[package]
name = "codemark-cli"
version = "0.7.11"
edition = "2024"
description = "CLI for Codemark"
license = "MIT"

[[bin]]
name = "codemark"
path = "src/main.rs"

[[bin]]
name = "gen-man-pages"
path = "src/bin/gen-man-pages.rs"
required-features = ["man-pages"]

[features]
man-pages = ["clap_mangen"]

[dev-dependencies]
tempfile = { workspace = true }
insta = { version = "1.39", features = ["yaml"] }
git2 = { workspace = true }
rusqlite = { workspace = true }
tree-sitter = { workspace = true }
codetours-server = { path = "../codetours-server" }
axum = { workspace = true }

[dependencies]
codemark-core = { path = "../codemark-core" }
clap = { workspace = true }
clap_complete = "4"
clap_mangen = { version = "0.2", optional = true }
comfy-table = "7"
is-terminal = "0.4"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
handlebars = "6"
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", features = ["json", "stream"] }
zstd = "0.13"
rusqlite = { workspace = true }
webbrowser = "1"
url = "2"
urlencoding = "2"
axum = { workspace = true }
tokio-util = "0.7"
open = "5.3.5"
copypasta = "0.10.2"
tracing = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
