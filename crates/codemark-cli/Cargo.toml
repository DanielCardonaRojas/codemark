[package]
name = "codemark-cli"
version = "0.5.4"
edition = "2024"
description = "CLI for Codemark"
license = "MIT"

[[bin]]
name = "codemark"
path = "src/main.rs"

[[bin]]
name = "gen-man-pages"
path = "src/bin/gen-man-pages.rs"
required-features = ["man-pages"]

[features]
man-pages = ["clap_mangen"]

[dev-dependencies]
tempfile = { workspace = true }
insta = { version = "1.39", features = ["yaml"] }
git2 = { workspace = true }
rusqlite = { workspace = true }
tree-sitter = { workspace = true }

[dependencies]
codemark-core = { path = "../codemark-core" }
clap = { workspace = true }
clap_complete = "4"
clap_mangen = { version = "0.2", optional = true }
comfy-table = "7"
is-terminal = "0.4"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
handlebars = "6"
shlex = "1.3.0"
uuid = { workspace = true }
chrono = { workspace = true }
