[package]
name = "codemark-cli"
version = "0.5.4"
edition = "2024"
description = "CLI for Codemark"
license = "MIT"

[[bin]]
name = "codemark"
path = "src/main.rs"

[[bin]]
name = "gen-man-pages"
path = "src/bin/gen-man-pages.rs"
required-features = ["man-pages"]

[features]
man-pages = ["clap_mangen"]

[dev-dependencies]
tempfile = "3"
insta = { version = "1.39", features = ["yaml"] }

[dependencies]
codemark-core = { path = "../codemark-core" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = { version = "0.2", optional = true }
comfy-table = "7"
is-terminal = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
handlebars = "6"
shlex = "1.3.0"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
