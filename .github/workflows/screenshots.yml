name: Screenshots

# Regenerate the README TUI screenshot gallery from the live binary and open a
# PR with the updated images. Run manually, or automatically when a release is
# published (so the gallery tracks the released UI).
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    name: Regenerate gallery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # vhs renders inside a headless terminal (ttyd) and encodes frames with
      # ffmpeg.
      - name: Install vhs and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          # ttyd (terminal vhs drives)
          TTYD_URL="https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64"
          sudo curl -fsSL "$TTYD_URL" -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          # vhs
          go install github.com/charmbracelet/vhs@latest || true
          if ! command -v vhs >/dev/null; then
            VHS_VER="0.8.0"
            curl -fsSL "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VER}/vhs_${VHS_VER}_Linux_x86_64.tar.gz" \
              | tar -xz -C /tmp
            sudo mv /tmp/vhs_${VHS_VER}_Linux_x86_64/vhs /usr/local/bin/vhs
          fi
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # The tapes render with "FiraCode Nerd Font Mono" so the TUI's Nerd Font
      # icons (file/health glyphs) appear. The apt `fonts-firacode` package lacks
      # the patched glyphs, so install the Nerd Font release directly.
      - name: Install FiraCode Nerd Font
        run: |
          NF_VER="3.2.1"
          mkdir -p ~/.local/share/fonts
          curl -fsSL "https://github.com/ryanoasis/nerd-fonts/releases/download/v${NF_VER}/FiraCode.tar.xz" \
            | tar -xJ -C ~/.local/share/fonts
          fc-cache -f
          # Sanity-check the family name the tapes reference is available.
          fc-list | grep -i "FiraCode Nerd Font Mono" | head -1

      - name: Capture screenshots
        run: ./screenshots/capture.sh

      - name: Open PR with updated screenshots
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-screenshots
          base: main
          commit-message: "chore: regenerate TUI screenshot gallery"
          title: "chore: regenerate TUI screenshot gallery"
          body: |
            Automated regeneration of the README screenshot gallery from the
            live TUI (`screenshots/capture.sh`).

            Triggered by: `${{ github.event_name }}`.
          add-paths: |
            screenshots/images/*.png
