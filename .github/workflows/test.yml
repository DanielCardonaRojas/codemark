name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          # - beta
          # - nightly
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        run: cargo check --verbose

      - name: Run cargo test
        run: cargo test --verbose

      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  cross-platform:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every target independently so one platform's failure doesn't
      # mask the others — important while we're stabilizing Linux/Windows.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Set up Zig (musl C/C++ cross toolchain)
        # The candle/tokenizers stack pulls in a C++ dep (esaxx-rs); musl-tools
        # only ships a C compiler, so we use Zig as the C/C++ cross-compiler via
        # cargo-zigbuild instead.
        if: endsWith(matrix.target, '-musl')
        uses: mlugg/setup-zig@v1
        with:
          # Pin a stable, archived release. `latest` resolved to a version the
          # download mirrors hadn't synced (looked under /builds/ and 404'd);
          # an explicit version uses the reliable /download/<ver>/ path.
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: endsWith(matrix.target, '-musl')
        run: cargo install cargo-zigbuild --locked

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build client binaries
        # This is a portability canary: it must compile and link for each target.
        # Use the default (dev) profile, not `--profile dist` — the release-only
        # LTO + single-codegen-unit settings would massively slow CI without
        # adding signal (the actual optimized build runs in release.yml on tag).
        shell: bash
        env:
          # sqlite-vec.c uses BSD type names (u_int8_t, …) that glibc defines but
          # musl does not; map them to the standard C99 names for the musl build.
          CFLAGS_x86_64_unknown_linux_musl: "-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t"
        run: |
          if [[ "${{ matrix.target }}" == *-musl ]]; then
            cargo zigbuild --target "${{ matrix.target }}" --bin codemark --bin codemark-tui
          else
            cargo build --target "${{ matrix.target }}" --bin codemark --bin codemark-tui
          fi

  rustfmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check
