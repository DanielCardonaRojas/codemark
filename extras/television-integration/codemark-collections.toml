[metadata]
name = "codemark-collections"
description = "Codemark collections picker - select a collection to view its bookmarks"
requirements = ["codemark"]

[source]
command = "codemark collection list --line-format \"{ID}\t{NAME}\t{COUNT}\t{DESCRIPTION}\""
display = "{split:\t:1}  ({split:\t:2} bookmarks)  {split:\t:3}"
output = "{split:\t:0}"

[preview]
command = "codemark collection show {split:\t:0} --format table"
offset = "0"

[ui]
layout = "portrait"

[ui.preview_panel]
size = 55

[keybindings]
shortcut = "F6"
enter = "actions:show"
ctrl-d = "actions:delete"
ctrl-x = "actions:delete_with_bookmarks"

[actions.show]
description = "Show bookmarks in this collection (opens television with codemark channel)"
command = "CODEMARK_COLLECTION_ID_FILTER=\"{split:\t:0}\" tv codemark"
mode = "execute"

[actions.delete]
description = "Delete collection (keep bookmarks)"
command = "codemark collection delete {split:\t:0}"
mode = "execute"

[actions.delete_with_bookmarks]
description = "Delete collection AND all its bookmarks"
command = "codemark collection delete {split:\t:0} --with-bookmarks"
mode = "execute"
