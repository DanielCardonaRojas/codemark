[metadata]
name = "codemark-collections"
description = "Codemark collections picker - select a collection to view its bookmarks"
requirements = ["codemark"]

[source]
command = "codemark collection list --line-format \"{NAME}\t{COUNT}\t{DESCRIPTION}\""
display = "{split:\t:0}  ({split:\t:1} bookmarks)  {split:\t:2}"
output = "{split:\t:0}"

[preview]
command = "codemark collection show {split:\t:0} --format table"
offset = "0"

[ui.preview_panel]
size = 55

[keybindings]
shortcut = "F6"
enter = "actions:show"

[actions.show]
description = "Show bookmarks in this collection (opens television with codemark channel)"
command = "CODEMARK_COLLECTION_FILTER=\"{split:\t:0}\" tv codemark"
mode = "execute"
