host = "0.0.0.0"
port = 8080
data_dir = "/data"
log_level = "info"

[storage]
pool_size = 4

[auth]
mode = "github"

[auth.github]
# Secrets are read from environment variables:
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, JWT_SECRET
#
# Must match your public HTTPS domain configured in Caddy/GitHub OAuth app
callback_url = "https://codetours.fly.dev/auth/github/callback"
