services:
  server:
    build: .
    volumes:
      - ./data:/data
      - ./deploy/config.production.toml:/etc/codetours/config.toml:ro
    environment:
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - JWT_SECRET
    env_file:
      - .env
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN
    env_file:
      - .env
    depends_on:
      - server
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
