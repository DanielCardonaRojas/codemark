# Codemark Configuration File
#
# This file controls codemark's behavior. Edit these values to customize
# how codemark works in your repository.

[open]
# Default editor command for `codemark open`.
# Placeholders: {FILE} (absolute path), {LINE_START}, {LINE_END}, {ID}
# If not set, uses $EDITOR or falls back to "vim".
default = "vim +{LINE_START} {FILE}"

# Extension-specific editor commands (these override the default).
# Uncomment and customize as needed for your preferred editors.
[open.extensions]
# Rust files with neovim
rs = "nvim +{LINE_START} {FILE}"
# Swift files with Xcode edit
swift = "xed --line {LINE_START} {FILE}"
# Markdown files with typora
# md = "typora {FILE}"
# Python files with VS Code
py = "code --goto {FILE}:{LINE_START}:{LINE_END}"

# Configure which editors should block (wait) vs. run in background.
[open.editor_types]
# Terminal editors - codemark waits for them to exit before returning.
terminal = ["vim", "vi", "nvim", "neovim", "emacs", "nano", "micro", "hx"]
# GUI editors - codemark spawns them and returns immediately.
gui = ["xed", "code", "idea", "subl", "typora"]

[storage]
# Maximum number of resolution history entries to keep per bookmark.
# Older entries are automatically pruned after each new resolution.
# Default: 20
max_resolutions_per_bookmark = 20

[health]
# Number of days before an active or drifted bookmark is considered stale
# if it hasn't been re-resolved.
# Default: 30
stale_after_days = 30

# Number of days before a stale bookmark is considered for auto-archiving.
# Used by the `codemark heal --auto-archive` command.
# Default: 7
auto_archive_after_days = 7

# Maximum age in hours for cached collection health before a recompute
# is recommended. (Primarily used by the web UI).
# Default: 24
read_max_age_hours = 24

[semantic]
# Enable semantic search using vector embeddings.
# When enabled, bookmarks can be searched by meaning rather than exact keywords.
# Default: true
enabled = true

# Embedding model to use for semantic search.
# Options:
#   - "all-minilm-l6-v2" (default): 384 dimensions, ~80MB model
#   - "bge-small-en-v1.5": 384 dimensions, ~130MB model (better quality)
# model = "all-minilm-l6-v2"

# Directory for storing downloaded embedding models.
# If not specified, uses a global cache directory:
#   - macOS: ~/Library/Caches/codemark/models
#   - Linux: ~/.cache/codemark/models
#   - Windows: %LOCALAPPDATA%\codemark\cache\models
# Can also be set via the CODMARK_MODELS_DIR environment variable.
# Supports ~ expansion for home directory.
# models_dir = "~/.cache/codemark/models"

# Batch size for embedding generation during reindex.
# Larger values are faster but use more memory.
# Default: 32
# batch_size = 32

# Distance metric for semantic similarity search.
# Options:
#   - "l2" (default): Euclidean distance, range [0, ∞), lower is better
#   - "cosine": Cosine distance (1 - similarity), range [0, 2], lower is better
#   - "ip": Inner product (dot product), range (-∞, ∞), higher is better
# distance_metric = "l2"

# Maximum distance threshold for semantic search matches.
# Results with distance worse than this threshold are filtered out.
# - For "l2" and "cosine": only returns results with distance <= threshold
# - For "ip": only returns results with distance >= threshold
# Set to null to disable threshold filtering (return all results).
# Typical values: 0.3-0.5 for l2/cosine, 0.7-0.9 for ip
# threshold = 0.4

[databases]
# Additional database paths to include in read-only cross-repo queries.
# The primary database (current repo) is always included.
# This setting is only recognized in .codemark/config.toml (local repo config).
# Supports ~ expansion and relative paths (relative to repo root).
# Additional databases are read-only; write operations affect only the primary DB.
# additional = [
#     "../shared-library/.codemark/codemark.db",
#     "~/projects/dependency-repo/.codemark/codemark.db",
# ]

[identity]
# User identity configuration for database ownership and bookmark attribution.
# When sharing databases with colleagues, this helps identify whose bookmarks are whose.
# These settings override git config detection.

# Override for git user.email.
# Used as the database owner identifier in the repos table.
# email = "user@example.com"

# Override for git user.name.
# Stored as the owner's display name in the repos table.
# name = "Full Name"

# Force a specific identity string (overrides both email and name).
# force = "custom-identity"


[tui]
# Syntax-highlighting theme for the TUI code preview.
#
# Bundled theme names include (case-sensitive):
#   OneHalfDark (default), OneHalfLight, Dracula, Nord, TwoDark,
#   gruvbox-dark, gruvbox-light, Solarized (dark), Solarized (light),
#   Monokai Extended, GitHub, Visual Studio Dark+, zenburn, ansi, base16
#
# You can also drop your own `.tmTheme` files into
#   ~/.config/codemark/themes/
# and reference them here by file name (without the `.tmTheme` extension).
# A user theme that shares a bundled name takes precedence.
# theme = "Dracula"
