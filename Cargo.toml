[workspace]
members = [
    "crates/codemark-core",
    "crates/codemark-cli",
    "crates/codetours-server",
    "crates/codemark-tui",
]
resolver = "2"

# `release` stays fast for day-to-day `cargo build/install --release`.
[profile.release]
strip = true         # cheap; remove symbols
opt-level = "z"      # optimize for size

# `dist` is the size-optimized profile used for published binaries. The
# expensive settings (lto + single codegen unit) live here so they don't slow
# down ordinary development builds. Build with: cargo build --profile dist
[profile.dist]
inherits = "release"
lto = true           # cross-crate inlining + dead-code elimination
codegen-units = 1    # better optimization, smaller output
panic = "abort"      # drop unwinding tables

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
# git2 is used only for local repository operations (open/discover/commit/blob);
# all network git access goes through the `git` CLI in git/remote.rs. We disable
# the default `https`/`ssh` features (which pull in openssl-sys) and vendor
# libgit2 so cross-compiling to musl/Windows needs no system C libraries.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tree-sitter = "0.25"
tempfile = "3"
deadpool-sqlite = "0.12"
jsonwebtoken = "9"
# rustls-tls instead of the default native-tls (openssl) backend so binaries
# link no system TLS library — required for static musl builds and simple
# Windows cross-compilation. Crates needing streaming add `features = ["stream"]`.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing-appender = "0.2"
urlencoding = "2"

# Release pipeline configuration for `dist` (formerly cargo-dist).
#
# This block records WHAT we publish; the actual GitHub Actions release
# workflow is GENERATED from it — do not hand-edit the workflow. After changing
# anything here, regenerate with:
#
#     cargo install cargo-dist        # provides the `dist` binary
#     dist init                       # pins cargo-dist-version + writes .github/workflows/release.yml
#     git add Cargo.toml .github/workflows/release.yml
#
# `dist init` adds the required `cargo-dist-version = "<x.y.z>"` key (pinned to
# the installed tool) on first run.
[workspace.metadata.dist]
# Build with the size-optimized profile defined above.
cargo-dist-profile = "dist"
# Generate a GitHub Actions release workflow.
ci = ["github"]
# Prebuilt-binary install methods: curl|sh, irm|iex (PowerShell), and a
# Homebrew formula pushed to the existing tap (replaces the source-build formula
# that release.sh prepared today).
installers = ["shell", "powershell", "homebrew"]
tap = "DanielCardonaRojas/homebrew-codemark"
publish-jobs = ["homebrew"]
# Platforms to ship prebuilt binaries for. musl gives a fully static Linux
# binary that runs on any distro.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
